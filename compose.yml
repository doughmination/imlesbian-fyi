services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - infra
    ports:
      - "127.0.0.1:4071:4071"
    environment:
      NODE_ENV: production
      PORT: 4071
      DATABASE_URL: postgres://${POSTGRES_USER:-imlesbian}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-db}:5432/${POSTGRES_DB:-imlesbian_fyi}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.imlesbian.fyi}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://imlesbian.fyi}
      FRONTEND_DASHBOARD_URL: ${FRONTEND_DASHBOARD_URL:-https://imlesbian.fyi/dashboard}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?DISCORD_CLIENT_ID is required}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?DISCORD_CLIENT_SECRET is required}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-https://api.imlesbian.fyi/auth/discord/callback}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - infra
    environment:
      NODE_ENV: production
      PORT: 4070
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.imlesbian.fyi}
    ports:
      - "127.0.0.1:4070:4070"

networks:
  infra:
    external: true