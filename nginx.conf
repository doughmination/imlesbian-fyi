# nginx config for imlesbian.fyi
#
# Handles:
#   1. Root domain + wildcard subdomains  -> frontend (Next.js) container
#   2. api.imlesbian.fyi                  -> backend (Hono) container,
#      bypassing the frontend entirely (this is why "api" is a reserved
#      subdomain in both proxy.ts and the backend's validation.ts — nginx
#      matches this exact server_name before falling through to the
#      wildcard block, so it never even reaches the Next.js proxy)
#   3. Connected custom domains, e.g. links.example.com — these need their
#      own server block (or a certbot-managed include) added per domain
#      once verified. See docs/custom-domains.md for the automation plan.
#
# Host header is forwarded untouched in all cases — the frontend's proxy.ts
# and the backend both depend on reading the original Host.
#
# Service names (frontend, backend) assume this file is running inside the
# same docker compose network as compose.yml at the repo root. If you're
# running nginx outside Docker, swap these for 127.0.0.1:<port>.

upstream imlesbian_frontend {
    server 127.0.0.1:4070;
    keepalive 32;
}

upstream imlesbian_backend {
    server 127.0.0.1:4071;
    keepalive 32;
}

# --- HTTP -> HTTPS redirect, covers root + all subdomains (incl. api) ---
server {
    listen 80;
    listen [::]:80;
    server_name imlesbian.fyi *.imlesbian.fyi;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: api.imlesbian.fyi -> backend directly ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.imlesbian.fyi;

    ssl_certificate     /etc/letsencrypt/live/imlesbian.fyi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imlesbian.fyi/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    limit_req zone=imlesbian_general burst=20 nodelay;

    location / {
        proxy_pass http://imlesbian_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

# --- HTTPS: root domain + wildcard subdomains -> frontend ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name imlesbian.fyi *.imlesbian.fyi;

    # Wildcard cert covering imlesbian.fyi and *.imlesbian.fyi.
    # Issue via DNS-01 (required for wildcards) e.g.:
    #   certbot certonly --manual --preferred-challenges=dns \
    #     -d imlesbian.fyi -d *.imlesbian.fyi
    # or automate with a Cloudflare DNS plugin (certbot-dns-cloudflare).
    ssl_certificate     /etc/letsencrypt/live/imlesbian.fyi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imlesbian.fyi/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    limit_req zone=imlesbian_general burst=20 nodelay;

    location / {
        proxy_pass http://imlesbian_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

# Rate limit zone — put this in the top-level http{} block (nginx.conf),
# not here, since limit_req_zone can't live inside a server block:
#   limit_req_zone $binary_remote_addr zone=imlesbian_general:10m rate=10r/s;
